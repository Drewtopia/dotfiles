name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          mise_toml: |
            [tools]
            chezmoi = "2.70.0"
            node = "24"
            jq = "1.7.1"
            gitleaks = "8.28.0"
            "github:Dicklesworthstone/destructive_command_guard" = "0.16.0"
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq zsh
      # The tests that render a template with no data of their own read it from chezmoi's config.
      - name: chezmoi config from the CI data
        run: |
          mkdir -p ~/.config/chezmoi
          jq '{data: .}' tests/fixtures/ci-data.json > ~/.config/chezmoi/chezmoi.json
      - name: Templates render
        run: bash tests/render-templates.test.sh
      - name: dcg policy
        run: node --test 'tests/*.test.js'
      - name: Agent shell
        run: bash tests/agent-shell.test.sh
      - name: Claude hooks
        working-directory: home/dot_claude/hooks
        run: node --test 'tests/*.test.js'
