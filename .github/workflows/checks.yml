name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          mise_toml: |
            [tools]
            chezmoi = "2.70.0"
            node = "24"
            jq = "1.7.1"
            gitleaks = "8.28.0"
            "github:Dicklesworthstone/destructive_command_guard" = "0.16.0"
      # Only tests that bring their own data run here; the template and shell tests need a machine's chezmoi data.
      - name: dcg policy
        run: node --test 'tests/*.test.js'
      - name: Claude hooks
        working-directory: home/dot_claude/hooks
        run: node --test 'tests/*.test.js'
