# Installed by run_onchange_after_60-install-skills via `npx skills`. `agents`
# omitted = every detected agent. Payloads always land in ~/.agents/skills,
# which Codex/Cursor/Copilot read directly; only Claude gets symlinks.
# `host:` names an agent-host answer from .chezmoi.toml.tmpl (orca, t3_code):
# the repo installs only where that answer is yes.
skill_repos:
  - repo: mattpocock/skills
    # Non-Claude agents have no plugin equivalent, so they take the whole repo.
    agents:
      - codex
      - cursor
      - github-copilot
    skills:
      - "*"
  - repo: mattpocock/skills
    # Only skills the mattpocock-skills plugin omits: a bare copy of a plugin
    # skill would shadow the namespaced one. in-progress/ is unstable upstream.
    agents:
      - claude-code
    skills:
      # misc/
      - git-guardrails-claude-code
      - migrate-to-shoehorn
      # in-progress/
      - loop-me
      - setup-ts-deep-modules
      - claude-handoff
      - chief-of-staff
  - repo: github/awesome-copilot
    skills:
      - conventional-commit
      - playwright-generate-test
  - repo: conventional-branch/conventional-branch
    skills:
      - conventional-branch
  - repo: anivar/zod-skill
    skills:
      - zod
  - repo: currents-dev/playwright-best-practices-skill
    # playwright-waits loads this one.
    skills:
      - playwright-best-practices
  - repo: microsoft/playwright-cli
    skills:
      - playwright-cli
  - repo: blader/humanizer
    # Claude takes this from the humanizer@humanizer plugin.
    agents:
      - codex
      - cursor
      - github-copilot
    skills:
      - humanizer
  - repo: microsoftdocs/agent-skills
    skills:
      - azure-repos
  - repo: stablyai/orca
    host: orca
    skills:
      - orca-cli
      - orchestration
      - orca-computer-use
  - repo: shadcn/improve
    skills:
      - improve
  - repo: dmmulroy/anti-slop
    skills:
      - install-anti-slop
  - repo: vercel-labs/skills
    skills:
      - find-skills
  - repo: cursor/plugins
    # Claude also has these from the pstack plugin; the bare copies are kept on purpose.
    skills:
      - technical-writing
      - unslop
      - no-comments
  - repo: testdino-hq/playwright-skill
    skills:
      - playwright-ci
      - playwright-core
