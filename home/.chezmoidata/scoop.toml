# Read by run_onchange_before_10-install-scoop, which does the work gating
# (chezmoidata cannot hold template syntax). Scoop covers Windows-native
# binaries that mise can't, installed inside the whitelisted tools tree.

[scoop]
buckets = ["extras", "nerd-fonts"]

# Only Windows-specific or non-mise-able tools belong here.
packages = [
  "kanata",
  "Meslo-NF",
  "CascadiaCode-NF",      # installs as "CaskaydiaCove Nerd Font"
  "JetBrainsMono-NF",     # installs as "JetBrainsMono Nerd Font"
]

# URLs for buckets not in `scoop bucket known`.
[scoop.bucket_urls]

[scoop.work]
buckets = []
# zed via scoop on work: winget's Zed manifest is machine-scope only and
# rejects --location, so it can't land under the whitelisted tools_root.
packages = [
  "zed",
  "wezterm",
]
# Machine scope; run_onchange_before_15-install-scoop-admin self-elevates for these.
admin_packages = []
