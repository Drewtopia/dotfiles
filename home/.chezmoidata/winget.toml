# Read by run_onchange_before_08-install-winget-pkgs, which does the
# personal/work gating (chezmoidata cannot hold template syntax).

[winget]
# IDs exactly as published in winget-pkgs.
packages = [
  "AgileBits.1Password.CLI",
  "JanDeDobbeleer.OhMyPosh",
  "marlocarlo.psmux",
]

# Changes HOW a selected package installs: bare flags, default location, no
# `--scope user --location` (which rejects machine-scope-only manifests).
# NOTE: must stay above the [winget.*] sub-tables or TOML binds it to one.
no_scope = [
  # Not machine-scope: kept in the default WinGet\Packages dir because the WSL
  # op shim (.chezmoitemplates/op-wsl-shim) looks for op.exe there.
  "AgileBits.1Password.CLI",
  "Zen-Team.Zen-Browser",
]

# Machine-scope installers are fine here: personal boxes have admin and no whitelist.
[winget.personal]
packages = [
  "ZedIndustries.Zed",
  "wez.wezterm",
  "StablyAI.Orca",
]

# Installed with --scope user --location <tools_root>\tools. Rejected
# manifests go in `no_scope` (GUI apps) or scoop.toml [scoop.work] (dev tools).
[winget.work]
packages = [
  "Zen-Team.Zen-Browser",
]
