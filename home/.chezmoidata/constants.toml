[github]
    username = "Drewtopia"

# Personal git/jj author identity — the GLOBAL default on every machine. Kept as
# static data (not a 1Password lookup) because it is not a secret: this email is
# already the public author of this repo's history. Sourcing it from a vault would
# add an apply-breaking dependency on machines that can't reach the personal vault
# (e.g. a work box signed into only the Employee vault). Work identity is applied
# separately, scoped to Azure DevOps remotes, via git/config.tmpl's includeIf.
[identity]
    name = "Drew"
    email = "drew@drewtopia.com.au"

[pwsh]
    # oh-my-posh theme name (file under $env:POSH_THEMES_PATH, no extension).
    # Override per-machine via .chezmoi.toml's [data.pwsh] table if needed.
    posh_theme = "spaceship"