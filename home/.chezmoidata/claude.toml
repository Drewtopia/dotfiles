# Claude Code plugin marketplaces — single source of truth for the
# `claude plugin marketplace add` reconciler.
#
# Consumed by run_onchange_after_55-add-claude-marketplaces.{sh,ps1}.tmpl,
# which registers each marketplace (idempotent) — and since `marketplace add`
# also refreshes an already-registered one, that loop is the refresh path too.
#
# dot_claude/modify_settings.json.tmpl renders extraKnownMarketplaces from
# this table.
#
# Format: <marketplace-short-name> = "<github-owner/repo>"
# The short name is what plugin references use (e.g. "caveman@caveman").

[marketplaces]
caveman                   = "JuliusBrussee/caveman"
"claude-brain-sync"       = "toroleapinc/claude-brain"
"claude-plugins-official" = "anthropics/claude-plugins-official"
"i-have-adhd"             = "ayghri/i-have-adhd"
"karpathy-skills"         = "forrestchang/andrej-karpathy-skills"
mattpocock                = "mattpocock/skills"
"obsidian-skills"         = "kepano/obsidian-skills"
qmd                       = "tobi/qmd"
"superpowers-extended-cc-marketplace" = "pcvelz/superpowers"
ecc                       = "affaan-m/ECC"
worktrunk                 = "max-sixty/worktrunk"

# Plugin enablement — grouped by profile (machine class). See CONTEXT.md.
# Format: "<plugin-name>@<marketplace-name>" = <bool>
#   true  = enabled (Claude Code loads + activates)
#   false = installed-but-suppressed (preserves "considered and rejected" record)
# Profile = the section name. A plugin needed under multiple profiles must
# be listed in each (no multi-gate field; trade-off for tight readability).

[plugins.always]
# Retired Jul 2026 (zero MCP calls across 50 sessions), reinstated Aug 2026.
# WebFetch on a library's own docs turned out to be a poorer substitute than
# the retirement note assumed.
#
# Flipping this to true is not enough on its own: modify_settings.json.tmpl
# merges managed settings as a floor UNDER runtime, so a `false` already
# sitting in ~/.claude/settings.json wins. Each machine also needs
# `claude plugin enable context7@claude-plugins-official` once.
"context7@claude-plugins-official"                 = true
"hookify@claude-plugins-official"                  = true
# Retired Jul 2026 — never invoked. This repo carries no checked-in CLAUDE.md,
# so the audit/improve skills had nothing to act on.
"claude-md-management@claude-plugins-official"     = false
"superpowers@claude-plugins-official"              = false
# Retired Jul 2026 in favour of mattpocock-skills, which covers the same
# ground with one skill per job: test-driven-development→tdd,
# requesting-code-review→code-review, systematic-debugging→diagnosing-bugs,
# writing-plans→to-spec, brainstorming→grilling. Its using-superpowers skill
# also injected itself into every session's system prompt.
"superpowers-extended-cc@superpowers-extended-cc-marketplace" = false
# Retired Jul 2026 — one-shot "recommend automations for this repo" skill,
# never invoked after the initial setup pass it was installed for.
"claude-code-setup@claude-plugins-official"        = false
"security-guidance@claude-plugins-official"        = true
# Output shaping, not dev tooling — wanted on every machine.
# Upstream tag 0.1.0 added a redundant "hooks": "./hooks/hooks.json" to its
# manifest, which Claude Code rejects ("Duplicate hooks file detected") since
# hooks/hooks.json is auto-loaded. Until that is fixed upstream, a fresh install
# needs the key removed from the cached manifest to load.
"i-have-adhd@i-have-adhd"                          = true
"explanatory-output-style@claude-plugins-official" = true
"learning-output-style@claude-plugins-official"    = true
"ralph-loop@claude-plugins-official"               = false

[plugins.personal]
# Retired Aug 2026 — enabled since installation but never initialized: no
# brain-config.json and no ~/.claude/brain on the machines checked (darwin,
# work-wsl), so brain-sync bailed at its first guard and no cross-machine
# sync ever ran. drew-pd was unreachable at the time and still needs a
# `claude plugin disable` — the managed floor merge will not flip it. The
# job it was meant to do is already covered — chezmoi carries settings and
# skills, and the vault symlinks carry memory and rules.
"claude-brain-sync@claude-brain-sync" = false

[plugins.dev_computer]
# Retired Jul 2026 — markdown-KB search never used; the vault is reached through
# the obsidian plugin and ripgrep instead.
"qmd@qmd"                                 = false
# Both retired Jul 2026 — mattpocock-skills covers them (code-review, and
# to-spec → implement → codebase-design for feature work), and having three
# plugins answer the same trigger made skill selection worse, not better.
"code-review@claude-plugins-official"     = false
"feature-dev@claude-plugins-official"     = false
# Retired Jul 2026 — no recorded activity. Caveat: LSP usage tracking shipped
# late, so the zero may predate it; re-enable if TS work picks up again.
"typescript-lsp@claude-plugins-official"  = false
"commit-commands@claude-plugins-official" = true
# Retired Jul 2026 — zero MCP browser calls. Playwright *authoring* help still
# comes from the playwright-* skills in ~/.claude/skills, which are unaffected.
"playwright@claude-plugins-official"      = false
# Retired Jul 2026 — its agent was never dispatched; the simplify skill covers
# the same cleanup pass.
"code-simplifier@claude-plugins-official" = false
# Retired Jul 2026 — plugin authoring happens rarely and by hand; its skill
# listing was the single largest unused block in the session prompt.
"plugin-dev@claude-plugins-official"      = false
"caveman@caveman"                         = true
# Ships the 22 stable engineering/ + productivity/ skills, pinned to
# plugin.json's version. The 9 misc/ + in-progress/ skills it excludes
# stay on the `npx skills` path in .chezmoidata/skills.yaml.
"mattpocock-skills@mattpocock"            = true
"obsidian@obsidian-skills"                = true
"greptile@claude-plugins-official"        = false
# Retired Jul 2026: 889 skills + 306 agents, all of whose names and
# descriptions load at session start. The context cost outweighed the use we
# got from it, and it duplicated mattpocock-skills across tdd, code-review,
# research, plan and feature-dev. Re-enable if the orchestration pipelines
# (orch-*, multi-*, gan-*) are ever actually wanted.
"ecc@ecc"                                 = false
"worktrunk@worktrunk"                     = true
