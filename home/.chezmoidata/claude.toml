# Read by run_onchange_after_55-add-claude-marketplaces and by
# claude-settings-merge (extraKnownMarketplaces). Topgrade refreshes them.
# <short-name> = "<owner/repo>"; the short name is the "@caveman" in plugin refs.

[marketplaces]
caveman                   = "JuliusBrussee/caveman"
"claude-plugins-official" = "anthropics/claude-plugins-official"
"i-have-adhd"             = "ayghri/i-have-adhd"
"karpathy-skills"         = "forrestchang/andrej-karpathy-skills"
mattpocock                = "mattpocock/skills"
"obsidian-skills"         = "kepano/obsidian-skills"
qmd                       = "tobi/qmd"
"superpowers-extended-cc-marketplace" = "pcvelz/superpowers"
ecc                       = "affaan-m/ECC"
worktrunk                 = "max-sixty/worktrunk"
humanizer                 = "blader/humanizer"
superwhisper              = "superultrainc/superwhisper-claude-code"
"pstack-claude"           = "michael-denyer/pstack-claude"

# Section = profile (see CONTEXT.md); a plugin needed in several profiles is
# listed in each. false = installed but suppressed, kept as a rejection record.

[plugins.always]
# NOTE: settings merge as a floor under runtime, so a runtime `false` wins;
# a machine that had it off needs `claude plugin enable` once.
"context7@claude-plugins-official"                 = true
# No hookify rules in use, yet it runs python3 around every tool call.
"hookify@claude-plugins-official"                  = false
"claude-md-management@claude-plugins-official"     = false
"superpowers@claude-plugins-official"              = false
"superpowers-extended-cc@superpowers-extended-cc-marketplace" = true
"claude-code-setup@claude-plugins-official"        = false
"security-guidance@claude-plugins-official"        = true
"i-have-adhd@i-have-adhd"                          = true
# Superseded by the native `outputStyle` setting.
"explanatory-output-style@claude-plugins-official" = false
"learning-output-style@claude-plugins-official"    = false
"ralph-loop@claude-plugins-official"               = false
"remember@claude-plugins-official"                 = true
"session-report@claude-plugins-official"           = true

[plugins.personal]
"superwhisper@superwhisper" = false

[plugins.dev_computer]
"qmd@qmd"                                 = false
# mattpocock-skills covers these; several plugins on one trigger worsen skill selection.
"code-review@claude-plugins-official"     = false
"feature-dev@claude-plugins-official"     = false
"typescript-lsp@claude-plugins-official"  = false
"commit-commands@claude-plugins-official" = true
"playwright@claude-plugins-official"      = false
"code-simplifier@claude-plugins-official" = true
"plugin-dev@claude-plugins-official"      = false
"caveman@caveman"                         = true
"pr-review-toolkit@claude-plugins-official" = true
# Ships the stable engineering/ + productivity/ skills; the rest of the repo
# stays on the `npx skills` path in .chezmoidata/skills.yaml.
"mattpocock-skills@mattpocock"            = true
"obsidian@obsidian-skills"                = true
"greptile@claude-plugins-official"        = false
# Hundreds of skills and agents load at session start; the context cost
# outweighs the use, and it duplicates mattpocock-skills.
"ecc@ecc"                                 = false
"worktrunk@worktrunk"                     = true
# NOTE: not via `npx skills`: its root .claude-plugin/ would register a
# marketplace-less "humanizer@skills-dir" that `claude plugin update` can't resolve.
"humanizer@humanizer"                     = true
"andrej-karpathy-skills@karpathy-skills"  = true
# Take pstack skills only from this plugin; `npx skills` from cursor/plugins
# would add bare duplicates beside the namespaced ones.
"pstack@pstack-claude"                    = true

# Added by run_onchange_after_56-add-claude-mcp-servers; add-only, so deleting
# an entry does not remove it from ~/.claude.json. Each server runs one process
# per session, so keep work machines lean.

[mcp_servers.personal.sequential-thinking]
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-sequential-thinking"]
