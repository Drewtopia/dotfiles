# worktrunk USER config — renders to ~/.config/worktrunk/config.toml
#
# This is the global/user config (list display, global aliases, worktree-path
# template, LLM-commit settings). NOT shared per-repo. Per-project hooks (dev
# server, db, lint/test gates) belong in each repo's OWN .config/wt.toml,
# committed inside that repo — not in dotfiles.
#
# NOT a chezmoi .tmpl: worktrunk uses {{ }} template syntax (e.g.
# {{ branch | hash_port }}) that collides with chezmoi's. Plain file = chezmoi
# copies it verbatim and worktrunk keeps its {{ }}.
#
# Template vars: {{ branch }} {{ args }} {{ env }} {{ default_branch }}
#                {{ worktree_path }} {{ repo }} {{ target }}
# Filters:       {{ branch | hash_port }}  {{ branch | sanitize }}

# Place worktrees inside the repo under .claude/worktrees/<branch>, matching the
# Claude Code EnterWorktree layout. .claude/ is globally gitignored
# (~/.config/git/ignore), so nested worktrees never show up as untracked.
# Default would be a sibling dir: {{ repo_path }}/../{{ repo }}.{{ branch | sanitize }}
worktree-path = "{{ repo_path }}/.claude/worktrees/{{ branch | sanitize }}"

[list]
# LLM-generated one-line branch summaries in `wt list`.
summary = true
# Pin the `--format=json` output to schema 2 (structured repo/ci metadata). A
# future worktrunk release flips the default from 1 to 2; setting it explicitly
# keeps any `wt list --format=json` consumer stable across that change.
json-schema = 2

[aliases]
# Universally safe — works in any git repo, no language assumptions.
since-main = "git log --oneline {{ default_branch }}..HEAD"

# LLM commit/squash messages + the branch summaries enabled by [list] summary.
# --safe-mode runs claude hermetically (no hooks/plugins/MCP/skills/CLAUDE.md),
# so session hooks and project settings can't pollute the generated text;
# --setting-sources='user' keeps auth out of a project .claude/settings.json.
[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --safe-mode --setting-sources='user' --system-prompt=''"

# tmux session per worktree — https://worktrunk.dev/tips-patterns/#tmux-session-per-worktree
#
# Lives in USER config, not a repo's .config/wt.toml: a multiplexer is a personal
# preference, and a project hook would spawn tmux sessions for every developer
# who creates a worktree in that repo.
#
# The name comes from the BRANCH, never the directory. Worktree dirs drift from
# their branch — renames leave the old path behind, and Agent isolation="worktree"
# creates agent-<id> paths — so a $PWD-derived name (e.g. the `th` alias) labels
# sessions with something that looks meaningful and isn't.
#
# Starts claude in the pane, preserving what the `wtc` shortcut did before this
# hook existed (`wt switch --create --execute=claude`). The difference is that it
# now survives detaching, so worktrees left open keep a resident agent — `wtr`
# firing pre-remove is what stops that accumulating.
[pre-start]
tmux = """
command -v tmux >/dev/null 2>&1 || exit 0
S={{ branch | sanitize }}
W={{ worktree_path }}
# `=` anchors an exact match; without it tmux resolves the name as a prefix.
# `if` rather than `has-session && exit 0`: under `set -e` a bare failing
# has-session leaves the statement non-zero, which would abort the create.
if tmux has-session -t "=$S" 2>/dev/null; then exit 0; fi
# Capture the pane id: send-keys takes a target-pane, where the `=` exact-match
# prefix valid for session targets is a syntax error ("can't find pane").
P=$(tmux new-session -d -P -F '#{pane_id}' -s "$S" -c "$W" -n "$S")
tmux send-keys -t "$P" 'claude' Enter
echo "tmux session '$S' — attach with: ta $S"
"""

# Convergence guard — WARN (never block) when creating a worktree whose branch
# shares a ticket number with an existing branch/PR, so a second parallel effort
# on the same ticket surfaces at creation instead of colliding later (58436: two
# PRs rewrote the same specs, one dropped the other's fix). Exits 0 in every path
# so creation always proceeds; the `|| true` guards keep it from aborting the
# create under set -e / pipefail when a grep finds nothing.
collision-check = """
B={{ branch }}
T=$(printf '%s' "$B" | grep -oE '[0-9]{4,6}' | head -1 || true)
[ -z "$T" ] && exit 0
E=$(git branch -a --format='%(refname:short)' 2>/dev/null | grep -F "$T" | grep -vFx "$B" | grep -v HEAD | sort -u || true)
[ -z "$E" ] && exit 0
echo "⚠️ CONVERGE: work on ticket $T already exists —"
echo "$E" | sed 's/^/   • /'
echo "   Build on one of those, or Ctrl-C to abort this new '$B' worktree. (Warning only.)"
exit 0
"""

# Tear the session down with its worktree. Without this, sessions outlive the
# worktrees they were named for and accumulate like any other unreaped process.
[pre-remove]
tmux = "tmux kill-session -t '={{ branch | sanitize }}' 2>/dev/null || true"
