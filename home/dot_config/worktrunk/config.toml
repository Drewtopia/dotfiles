# NOT a chezmoi .tmpl: worktrunk's own {{ }} syntax collides with chezmoi's.
# Per-project hooks belong in each repo's .config/wt.toml, not here.
# .claude/ is globally gitignored, so nested worktrees never show as untracked.
worktree-path = "{{ repo_path }}/.claude/worktrees/{{ branch | sanitize }}"

[list]
# `summary` renders no column unless `full` is on: both gate on this flag.
full = true
summary = true
# Pinned so `wt list --format=json` consumers survive the upstream default flip.
json-schema = 2

[switch.picker]
pager = "delta --paging=never"

# Per-repo configs add their own excludes; the two lists combine.
[step.copy-ignored]
exclude = ["node_modules/", "dist/", ".turbo/"]

[aliases]
since-main = "git log --oneline {{ default_branch }}..HEAD"

# --safe-mode keeps hooks/plugins/CLAUDE.md out of the generated text;
# --setting-sources='user' keeps auth out of a project .claude/settings.json.
[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --safe-mode --setting-sources='user' --system-prompt=''"

# Named from the BRANCH: worktree dirs drift from their branch (renames, agent-<id>).
# Skipped under Claude or Orca, which already own the agent terminal; Orca's setup
# env carries ORCA_ROOT_PATH but not ORCA_WORKTREE_ID, which only its terminals set.
[pre-start]
tmux = """
if [ -n "${CLAUDECODE:-}" ] || [ -n "${ORCA_ROOT_PATH:-}" ] || [ -n "${ORCA_WORKTREE_ID:-}" ]; then exit 0; fi
command -v tmux >/dev/null 2>&1 || exit 0
S={{ branch | sanitize }}
# tmux reads `.` in a target as the window.pane separator.
S=$(printf '%s' "$S" | tr . -)
W={{ worktree_path }}
# `=` anchors an exact match. `if`, not `&& exit 0`: a failing has-session
# would abort the create under `set -e`.
if tmux has-session -t "=$S" 2>/dev/null; then exit 0; fi
# send-keys takes a pane target, where the `=` prefix is a syntax error.
P=$(tmux new-session -d -P -F '#{pane_id}' -s "$S" -c "$W" -n "$S")
tmux send-keys -t "$P" 'claude' Enter
echo "tmux session '$S' — attach with: ta $S"
"""

# Warn-only: flag an existing branch sharing this branch's ticket number.
# `|| true` keeps an empty grep from aborting the create under set -e/pipefail.
collision-check = """
B={{ branch }}
T=$(printf '%s' "$B" | grep -oE '[0-9]{4,6}' | head -1 || true)
[ -z "$T" ] && exit 0
E=$(git branch -a --format='%(refname:short)' 2>/dev/null | grep -F "$T" | grep -vFx "$B" | grep -v HEAD | sort -u || true)
[ -z "$E" ] && exit 0
echo "⚠️ CONVERGE: work on ticket $T already exists —"
echo "$E" | sed 's/^/   • /'
echo "   Build on one of those, or Ctrl-C to abort this new '$B' worktree. (Warning only.)"
exit 0
"""

# Report only; removal stays with /clean-workspace. Skipped under Claude.
merged-report = """
if [ -n "${CLAUDECODE:-}" ]; then exit 0; fi
R=$(wt step prune --dry-run 2>&1 || true)
N=$(printf '%s\\n' "$R" | grep -c ' — ' || true)
[ "$N" -gt 0 ] || exit 0
echo "🧹 $N merged worktrees or branches can go — preview: wt step prune --dry-run · remove: /clean-workspace"
exit 0
"""

[pre-remove]
tmux = """
S={{ branch | sanitize }}
S=$(printf '%s' "$S" | tr . -)
tmux kill-session -t "=$S" 2>/dev/null || true
"""
