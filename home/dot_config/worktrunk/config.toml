# NOT a chezmoi .tmpl: worktrunk's own {{ }} syntax collides with chezmoi's.
# Per-project hooks belong in each repo's .config/wt.toml, not here.
worktree-path = "~/dev/worktrees/{{ remote_repo }}/{{ branch | sanitize }}"

[list]
# `summary` renders no column unless `full` is on: both gate on this flag.
full = true
summary = true
# Pinned so `wt list --format=json` consumers survive the upstream default flip.
json-schema = 2

[switch.picker]
pager = "delta --paging=never"

# Per-repo configs add their own excludes; the two lists combine.
[step.copy-ignored]
exclude = ["node_modules/", "dist/", ".turbo/"]

[aliases]
since-main = "git log --oneline {{ default_branch }}..HEAD"
# `wt new <branch>`: the one way to open work. wt opens the branch's worktree (gates, hooks,
# exact branch name), creating the branch only when neither it nor origin's copy exists; then
# Orca shows it: its live tab if it has one, else a new Claude tab. `wt switch` alone leaves
# the session and Orca's view in the old worktree. `set -e`: a refused switch opens no tab.
new = """
set -e
set -- {{ args }}
C=--create
case "$1" in
  pr:* | mr:*) C= ;;
  *) if git rev-parse --verify --quiet "refs/heads/$1" >/dev/null ||
       git rev-parse --verify --quiet "refs/remotes/origin/$1" >/dev/null; then C=; fi ;;
esac
P=$(wt switch $C "$@" --no-cd --format=json | jq -r .path)
[ -n "$P" ] && [ "$P" != null ] || exit 1
# Orca finds a new worktree on its next poll, some seconds later.
i=0
until orca worktree show --worktree "path:$P" >/dev/null 2>&1; do
  i=$((i + 1))
  [ "$i" -lt 30 ] || { echo "wt new: Orca has not picked up $P after 30 s; open it there" >&2; exit 1; }
  sleep 1
done
H=$(orca terminal list --worktree "path:$P" --json |
  jq -r '[.result.terminals[] | select(.orphaned | not)][0].handle // empty')
if [ -n "$H" ]; then
  orca terminal switch --terminal "$H" >/dev/null
else
  orca terminal create --worktree "path:$P" --command claude --focus --json >/dev/null
fi
"""

# --safe-mode keeps hooks/plugins/CLAUDE.md out of the generated text;
# --setting-sources='user' keeps auth out of a project .claude/settings.json.
[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --safe-mode --setting-sources='user' --system-prompt=''"

[pre-start]
# Warn-only: flag an existing branch sharing this branch's ticket number.
# `|| true` keeps an empty grep from aborting the create under set -e/pipefail.
collision-check = """
B={{ branch }}
T=$(printf '%s' "$B" | grep -oE 'gh[0-9]+|[0-9]{4,6}' | head -1 || true)
[ -z "$T" ] && exit 0
E=$(git branch -a --format='%(refname:short)' 2>/dev/null | grep -F "$T" | grep -vFx "$B" | grep -v HEAD | sort -u || true)
[ -z "$E" ] && exit 0
echo "⚠️ CONVERGE: work on ticket $T already exists —"
echo "$E" | sed 's/^/   • /'
echo "   Build on one of those, or Ctrl-C to abort this new '$B' worktree. (Warning only.)"
exit 0
"""

# Report only; removal stays with you. Skipped under Claude.
merged-report = """
if [ -n "${CLAUDECODE:-}" ]; then exit 0; fi
R=$(wt step prune --dry-run 2>&1 || true)
N=$(printf '%s\\n' "$R" | grep -c ' — ' || true)
[ "$N" -gt 0 ] || exit 0
echo "🧹 $N merged worktrees or branches can go — preview: wt step prune --dry-run · remove: wt step prune"
exit 0
"""

# `.claude/` is globally ignored, so copy-ignored cannot deliver it to a new worktree.
# Copies, not symlinks: path-scoped rules do not load through a symlink leaving the worktree.
[post-start]
agent-guidance = """
P={{ primary_worktree_path }}
[ -d "$P/.claude/rules" ] || [ -d "$P/.claude/hooks" ] || exit 0
mkdir -p .claude
for e in rules hooks settings.json; do
  [ -L ".claude/$e" ] && rm ".claude/$e"
  [ -e "$P/.claude/$e" ] && cp -R "$P/.claude/$e" .claude/
done
exit 0
"""

# A new worktree's Orca card: in progress, linked to the branch's gh<n> issue.
# Runs from any shell, not only an Orca terminal: `orca` is Orca's CLI, which in WSL talks to the Orca
# server there. Skipped where `orca` is a distro package, such as the GNOME screen reader.
orca-card = """
case "$(command -v orca)" in '' | /usr/*) exit 0 ;; esac
N=$(printf '%s' "{{ branch }}" | grep -oE 'gh[0-9]+' | head -1 | tr -d gh || true)
orca worktree set --worktree path:{{ worktree_path }} --workspace-status in-progress ${N:+--issue "$N"} >/dev/null 2>&1 || true
exit 0
"""

[pre-remove]
# An Azure merge never closes the GitHub issue a branch carries, so name it while it is still open.
issue-reminder = """
N=$(printf '%s' "{{ branch }}" | grep -oE 'gh[0-9]+' | head -1 | tr -d gh || true)
[ -n "$N" ] || exit 0
R=${GH_ISSUE_TRACKER_REPO:-$(mise exec -- printenv GH_ISSUE_TRACKER_REPO 2>/dev/null || true)}
S=$(timeout 15 gh issue view "$N" ${R:+--repo "$R"} --json state --jq .state 2>/dev/null || true)
[ "$S" = "OPEN" ] && echo "GH-$N is still open: gh issue close $N${R:+ --repo $R}"
exit 0
"""
