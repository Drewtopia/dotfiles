# Drew's git policy for every repo on every machine, agents and Drew alike.
# The global git config's hook.personal-* entries run this file with LEFTHOOK_CONFIG, which
# is lefthook's documented way to use one config everywhere, so no repo needs enrolling.
# lefthook still merges a repo's lefthook-local config into that run, so the entries pass
# `--tag personal` and refuse to run in a repo that tracks one. They also pass `--force`,
# because lefthook skips a job when no files changed (an empty commit or push).
# `--no-verify` skips everything here; dcg asks before an agent does that.
# A repo can still extend this file from its own lefthook config, with an absolute path:
# lefthook expands neither ~ nor $HOME in extends.

# This runs inside repos that don't use lefthook: never install hooks into them.
no_auto_install: true

commit-msg:
  commands:
    # Rules: ~/.config/commit-check/cchk.toml, rendered by chezmoi.
    personal-policy:
      tags: [personal]
      run: commit-check --message --author-email --no-banner --config "$HOME/.config/commit-check/cchk.toml" {1}

pre-commit:
  commands:
    # Work goes through a branch. A repo with no remote has no PR to protect main for.
    personal-protected-branch:
      tags: [personal]
      only:
        - ref: main
        - ref: master
        - ref: develop
      skip:
        - merge
        - rebase
        - run: test -z "$(git remote)"
      run: echo "Commit on a protected branch refused. Commit on a branch (wt switch --create <type>/<slug>), or skip with --no-verify." >&2; exit 1
    # Staged changes only. betterleaks loads a repo's .betterleaks.toml or .gitleaks.toml only
    # when passed with --config.
    personal-secrets:
      tags: [personal]
      skip: [merge, rebase]
      run: betterleaks git --staged --redact --no-banner $(for f in .betterleaks.toml .gitleaks.toml; do [ -f "$f" ] && { echo --config "$f"; break; }; done) .

pre-push:
  commands:
    # lefthook's protect-branch example: refuse a push from a protected branch. A push from
    # another branch to one (HEAD:main) is left to the server: GitHub rulesets, Azure branch
    # policies.
    personal-protected-branch:
      tags: [personal]
      only:
        - ref: main
        - ref: master
        - ref: develop
      skip:
        - run: test -z "$(git remote)"
      run: echo "Push from a protected branch refused. Push a branch and open a PR, or skip with --no-verify." >&2; exit 1
    personal-branch-name:
      tags: [personal]
      run: commit-check --branch --no-banner --config "$HOME/.config/commit-check/cchk.toml"
    # A commit made with --no-verify reaches the push unchecked, so every local commit that no
    # remote branch has yet is checked again.
    personal-pushed:
      tags: [personal]
      skip: [merge, rebase]
      run: |
        for c in $(git rev-list HEAD --not --remotes); do
          commit-check --message --author-email --no-banner --config "$HOME/.config/commit-check/cchk.toml" --rev "$c" || exit 1
        done
        betterleaks git --log-opts="HEAD --not --remotes" --redact --no-banner $(for f in .betterleaks.toml .gitleaks.toml; do [ -f "$f" ] && { echo --config "$f"; break; }; done) .
