# Drew's git policy for every repo on every machine, agents and Drew alike.
# The global git config's hook.personal-* entries run this file with LEFTHOOK_CONFIG, which
# is lefthook's documented way to use one config everywhere, so no repo needs enrolling.
# lefthook still merges a repo's lefthook-local config into that run, so the entries pass
# `--tag personal` and refuse to run in a repo that tracks one. They also pass `--force`,
# because lefthook skips a job when no files changed (an empty commit or push).
# `--no-verify` skips everything here; dcg asks before an agent does that.
# A repo can still extend this file from its own lefthook config, with an absolute path:
# lefthook expands neither ~ nor $HOME in extends.

# This runs inside repos that don't use lefthook: never install hooks into them.
no_auto_install: true

commit-msg:
  commands:
    # Rules: ~/.config/commit-check/cchk.toml, rendered by chezmoi.
    personal-policy:
      tags: [personal]
      run: commit-check --message --author-email --no-banner --config "$HOME/.config/commit-check/cchk.toml" {1}

pre-commit:
  commands:
    # Work goes through a branch. A repo with no remote has no PR to protect main for.
    personal-protected-branch:
      tags: [personal]
      only:
        - ref: main
        - ref: master
        - ref: develop
      skip:
        - merge
        - rebase
        - run: test -z "$(git remote)"
      run: echo "Commit on a protected branch refused. Commit on a branch (wt switch --create <type>/<slug>), or skip with --no-verify." >&2; exit 1
    # Staged changes only. --unsafe-auto-load-config applies a repo's own .betterleaks.toml
    # (or .gitleaks.toml) allowlist, which betterleaks otherwise ignores.
    personal-secrets:
      tags: [personal]
      skip: [merge, rebase]
      run: betterleaks git --staged --redact --no-banner --unsafe-auto-load-config .

pre-push:
  commands:
    # Only git's pre-push stdin says which refs a push sends (lefthook's ref conditions and a
    # bare `commit-check --branch` see the checked-out branch, not `git push origin feat/x` or
    # `HEAD:main`), and lefthook gives stdin to one job only, so this job holds every push check:
    # - a push to, or deletion of, main, master or develop is refused;
    # - each pushed branch's name goes to commit-check --branch, which reads it from stdin;
    # - a commit made with --no-verify reaches the push unchecked, so every pushed commit that
    #   no remote branch has yet is checked again. An all-zero sha is a deletion.
    personal-pushed:
      tags: [personal]
      use_stdin: true
      skip: [merge, rebase]
      run: |
        cchk="$HOME/.config/commit-check/cchk.toml"
        while read -r _ sha rref _; do
          case "$rref" in
            refs/heads/main|refs/heads/master|refs/heads/develop)
              echo "Push to '${rref#refs/heads/}' refused. Push a branch and open a PR, or skip with --no-verify." >&2
              exit 1 ;;
          esac
          case "$sha" in *[!0]*) ;; *) continue ;; esac
          case "$rref" in
            refs/heads/*) printf '%s\n' "${rref#refs/heads/}" | commit-check --branch --no-banner --config "$cchk" || exit 1 ;;
          esac
          for c in $(git rev-list "$sha" --not --remotes); do
            commit-check --message --author-email --no-banner --config "$cchk" --rev "$c" || exit 1
          done
          betterleaks git --log-opts="$sha --not --remotes" --redact --no-banner --unsafe-auto-load-config . || exit 1
        done
