{{- /*
  System packages for `mise bootstrap packages`. Rendered twice: as
  ~/.config/mise/conf.d/bootstrap.toml, so `mise bootstrap packages status`
  shows drift from any shell, and inline in the before_10 install scripts,
  which run before chezmoi writes that file on a fresh machine.
  Windows: winget IDs come from .chezmoidata/winget.toml, on machines that
  are not relocated only. mise installs winget packages with bare flags, as
  the old loop did there; a relocated (work) machine needs --scope user
  --location for its whitelisted tools tree, which mise has no option for,
  so run_onchange_before_08-install-winget-pkgs keeps its own loop for it.
  Scoop stays on scoop.toml everywhere (mise's scoop is user scope only).
*/ -}}
{{- if eq .chezmoi.os "darwin" -}}
{{- $brews := list
    "btop"
    "curl"
    "dockutil"
    "ffmpeg"
    "git"
    "git-lfs"
    "gnu-units"
    "gnupg"
    "kanata"
    "mas"
    "pkgconf"
    "shellcheck"
    "tmux"
    "wget"
    "xz" -}}
{{- /* Third-party tap entries stay in the brew bundle in
       run_onchange_before_10-install-brew-packages: mise needs Ruby 3 to
       evaluate tap definitions that publish no API metadata. */ -}}
{{- $casks := list
    "1password@beta"
    "1password-cli"
    "arc"
    "betterdisplay"
    "bruno"
    "chatgpt"
    "discord"
    "fmail3"
    "firefox@developer-edition"
    "font-fira-code"
    "font-fira-code-nerd-font"
    "font-fira-mono-nerd-font"
    "font-jetbrains-mono"
    "font-jetbrains-mono-nerd-font"
    "font-monaspace"
    "font-symbols-only-nerd-font"
    "ghostty"
    "git-credential-manager"
    "hammerspoon"
    "hazel"
    "home-assistant"
    "iina"
    "iterm2"
    "jdownloader"
    "jump-desktop-connect"
    "keka"
    "keyclu"
    "muzzle"
    "obsidian"
    "orion"
    "plex"
    "raindropio"
    "rectangle-pro"
    "setapp"
    "spotify"
    "soundsource"
    "syntax-highlight"
    "tailscale-app"
    "telegram"
    "transmission"
    "unclack"
    "visual-studio-code"
    "wezterm"
    "zen"
    "qlmarkdown"
    "quicklook-video"
    "autodesk-fusion"
    "bambu-studio"
    "excalidrawz"
    "localsend"
    "navigator"
    "rcmd"
    "steam"
    "supasidebar" -}}
{{- /* "name;id": mise keys App Store apps by numeric ID; the name is a comment. */ -}}
{{- $mas := list
    "Actions;1586435171"
    "CloudMounter;1130254674"
    "Dato;1470584107"
    "Day Progress;6450280202"
    "Hyperduck;6444667067"
    "Just Press Record;1033342465"
    "Kagi Search;1622835804"
    "keymapp;6472865291"
    "Noir;1592917505"
    "Obsidian Web Clipper;6720708363"
    "Pandan;1569600264"
    "Parachute;6748614170"
    "Raycast Companion;6738274497"
    "Refined GitHub;1519867270"
    "Sink It;6449873635"
    "SponsorBlock;1573461917"
    "StopTheMadness Pro;6471380298"
    "uBlock Origin Lite;6745342698" }}
# Generated by chezmoi from .chezmoitemplates/mise-bootstrap.toml. Edit there.
[bootstrap.packages]
{{ range ($brews | sortAlpha | uniq) -}}
"brew:{{ . }}" = "latest"
{{ end -}}
{{ range ($casks | sortAlpha | uniq) -}}
"brew-cask:{{ . }}" = "latest"
{{ end -}}
{{ range ($mas | sortAlpha | uniq) -}}
{{ $m := splitList ";" . -}}
"mas:{{ index $m 1 }}" = "latest"  # {{ index $m 0 }}
{{ end -}}
{{- else if and (eq .chezmoi.os "linux") (includeTemplate "linux-supported" .) -}}
{{- /* CLI + shell tools live in mise [tools]: bat, fd, rg, gh, jq, age, fzf, zoxide, atuin, carapace, neovim */ -}}
{{- $apt := list
     "ca-certificates"
     "curl"
     "git"
     "gnupg"
     "tmux"
     "unzip"
     "xz-utils"
     "zsh"
     "btop"
     "git-lfs"
     "pkg-config"
     "units"
     "wget" -}}
{{- if .dev_computer -}}
{{-   $apt = mustAppend $apt "ffmpeg" -}}
{{- end -}}
{{- if not .ephemeral -}}
{{-   $apt = mustAppend $apt "xclip" -}}
{{- end }}
# Generated by chezmoi from .chezmoitemplates/mise-bootstrap.toml. Edit there.
[bootstrap.packages]
{{ range ($apt | sortAlpha | uniq) -}}
"apt:{{ . }}" = "latest"
{{ end -}}
{{- if and (not .ephemeral) (not .is_wsl) }}
"snap:code" = { classic = true }
{{ end -}}
{{- else if and (eq .chezmoi.os "windows") .dev_computer (not .relocated) -}}
{{- $winget := .winget.packages -}}
{{- if .personal -}}
{{-   $winget = concat $winget .winget.personal.packages -}}
{{- end -}}
{{- if .work -}}
{{-   $winget = concat $winget .winget.work.packages -}}
{{- end }}
# Generated by chezmoi from .chezmoitemplates/mise-bootstrap.toml. Edit there.
[bootstrap.packages]
{{ range ($winget | sortAlpha | uniq) -}}
"winget:{{ . }}" = "latest"
{{ end -}}
{{- end -}}
