# Order = offer priority; most-used keys first to stay under sshd MaxAuthTries=6.

{{ if .opVault -}}
[[ssh-keys]]
item = "SSH Key"
vault = "{{ .opVault }}"

# RSA fallback (Azure DevOps still doesn't support ed25519)
[[ssh-keys]]
item = "SSH Key - RSA"
vault = "{{ .opVault }}"

[[ssh-keys]]
item = "GitHub CLI"
vault = "{{ .opVault }}"
{{ end -}}
