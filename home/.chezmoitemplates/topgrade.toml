[include]


[misc]
# shell: chezmoi externals own oh-my-zsh (no .git) and zinit updates its plugins.
# containers: Docker Desktop is not always running. go: mise owns Go.
disable = ["shell", "containers", "go"]

# Refresh dotfiles first so the rest of the run upgrades against current config.
first = ["chezmoi"]

# Most skips are uninstalled tools or self-updaters that the mise step covers.
show_skipped = false

notify_end = "on_failure"

ask_retry = false
auto_retry = 1


[pre_commands]


[post_commands]
{{- if ne .chezmoi.os "windows" }}
# The native `skills` step relinks every skill into Claude; drop the undeclared ones.
reconcile-claude-skills = "{{ .chezmoi.homeDir }}/.local/bin/reconcile-claude-skills -y"
{{- end }}

[commands]
# Lowercase, space-free names so `--custom-commands <name>` needs no quoting.
# Skill updates need no command: topgrade's native `skills` step owns them.
# tv skips channels that already exist, so chezmoi keeps its custom overrides.
tv-channels = "tv update-channels"
{{- if and .work .is_wsl }}
# The WSL Orca server runs from an extracted AppImage that Orca's own updater can't replace.
orca-server = "{{ .chezmoi.homeDir }}/.local/bin/orca-server-update"
{{- end }}


[python]


[composer]


[brew]
# Also upgrade self-updating casks, so Homebrew's version stays accurate and a
# broken self-updater gets caught.
greedy_cask = true

autoremove = true


[chezmoi]


[mise]
# "latest" pins are no-ops; specific pins get bumped and the lockfile updated.
bump = true


[cargo]


[linux]


[git]


[windows]
updates_auto_reboot = "ask"

# Bypasses the Microsoft Store, which may be blocked.
wsl_update_use_web_download = true

# NOTE: topgrade 17.x rejects upstream's example name `winget_install_silently`.
winget_silent_install = true

# NOTE: self_rename stays off: mise owns topgrade's binary and upgrades it in the mise step.
# NOTE: winget_use_sudo stays off: upstream discourages it; some packages break elevated.


[npm]


[yarn]


[vim]


[firmware]


[vagrant]


[flatpak]


[distrobox]

[containers]

[lensfun]
